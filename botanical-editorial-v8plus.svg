<title id="t">Golden Hour — An illustrated botanical interlude</title><desc id="d">Elegant graphic of layered fern leaves, an engraved circular sun, and a simple ceramic cup on a little terrace, in warm tropical tones.</desc>
<defs>
<radialGradient id="glow"><stop stop-color="#f8e3ba" stop-opacity=".86"/><stop offset=".5" stop-color="#efd6aa" stop-opacity=".35"/><stop offset="1" stop-color="#efd6aa" stop-opacity="0"/></radialGradient>
<linearGradient id="disc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6deb0"/><stop offset=".55" stop-color="#dbbc8b"/><stop offset="1" stop-color="#e5c59a"/></linearGradient>
<linearGradient id="cup" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2cfb1"/><stop offset=".5" stop-color="#beaa91"/><stop offset="1" stop-color="#9a937d"/></linearGradient>
<style><![CDATA[
#foliage{transform-origin:335px 675px;animation:foliage 10s ease-in-out infinite alternate}
#steam{animation:steam 5s ease-in-out infinite alternate}
#orbit{animation:rot 70s linear infinite;transform-origin:355px 359px}
@keyframes foliage{to{transform:rotate(2.2deg)}}@keyframes steam{to{opacity:.3;transform:translateY(-11px)}}@keyframes rot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>
</defs>
