<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
<title id="title">An evening in the villa</title><desc id="description">Original storybook illustration of a warm, peaceful villa interior with soft linens, hanging lights and tropical palms visible through an arched window.</desc>
<defs><linearGradient id="walls" x2="0" y2="1"><stop stop-color="#ecdec8"/><stop offset=".62" stop-color="#d3bdab"/><stop offset="1" stop-color="#c3aa99"/></linearGradient><linearGradient id="nightSky" x2="0" y2="1"><stop stop-color="#34425e"/><stop offset=".62" stop-color="#826c86"/><stop offset="1" stop-color="#dbb5a6"/></linearGradient><linearGradient id="bed" x2=".1" y2="1"><stop stop-color="#faf0e0"/><stop offset=".65" stop-color="#e8d8ca"/><stop offset="1" stop-color="#bda899"/></linearGradient><linearGradient id="floor" x2="0" y2="1"><stop stop-color="#ac8f78"/><stop offset="1" stop-color="#6c6258"/></linearGradient><radialGradient id="bulb"><stop stop-color="#fff4ce"/><stop offset=".2" stop-color="#ffe1b2" stop-opacity=".72"/><stop offset="1" stop-color="#e9b78c" stop-opacity="0"/></radialGradient><filter id="haze"><feGaussianBlur stdDeviation="14"/></filter><clipPath id="window"><path d="M657 187Q657 95 795 95Q935 95 935 187V596H657Z"/></clipPath><style><![CDATA[
#curtain{animation:curtain 10s ease-in-out infinite alternate;transform-origin:670px 143px}
#bulbglow{animation:glow 6s ease-in-out infinite alternate}
#outside{animation:outside 16s ease-in-out infinite alternate}
@keyframes curtain{to{transform:skewX(2deg)}}@keyframes glow{to{opacity:.6}}@keyframes outside{to{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style></defs>
