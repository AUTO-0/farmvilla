<path d="M535 618V755M1067 562V724" stroke="#e8e1c6" stroke-width="13"/>
<path d="M529 619L1071 564" stroke="#d2ccb1" stroke-width="7"/>
<path d="M980 573L980 735" stroke="#dccfb7" stroke-width="11"/>
<!-- door and lattice -->
