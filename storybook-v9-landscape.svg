<path d="M1000 586L1052 580V711L1000 717Z" fill="#a6b59d" opacity=".42"/>
<circle cx="1040" cy="662" r="4" fill="#f9e8b9"/>
<path d="M1084 579V723M1107 578V731M1131 567V740M1156 561V749" stroke="#e6d5bb" stroke-width="5" opacity=".66"/>
<!-- hanging lanterns -->
<g id="lanterns"><circle cx="603" cy="624" r="77" fill="url(#lamp)" opacity=".65"/><circle cx="1005" cy="597" r="71" fill="url(#lamp)" opacity=".72"/><path d="M604 582V605M1006 554V574" stroke="#e2caaa" stroke-width="3"/><path d="M596 608L611 608L616 625L591 625Z M996 578L1011 578L1017 598L991 598Z" fill="#f8d69a" stroke="#e8bc80" stroke-width="3"/><path d="M596 612H612M996 581H1011" stroke="#fff1c4" stroke-width="2"/></g>
