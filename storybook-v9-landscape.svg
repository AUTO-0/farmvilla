<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="ttl desc">
<title id="ttl">The Enchanted Farmvilla</title><desc id="desc">An original illustrated countryside villa with a sloping roof, veranda, flowering tropical trees and warm evening lanterns beneath a dreamy sky.</desc>
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#243a49"/><stop offset=".36" stop-color="#62647c"/><stop offset=".68" stop-color="#d5a39c"/><stop offset="1" stop-color="#f1d6a8"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#fff1c4" stop-opacity=".95"/><stop offset=".34" stop-color="#ffe5b4" stop-opacity=".6"/><stop offset="1" stop-color="#ffebc7" stop-opacity="0"/></radialGradient>
<linearGradient id="hill" x2=".15" y2="1"><stop stop-color="#698b87"/><stop offset=".8" stop-color="#2e5d5c"/><stop offset="1" stop-color="#244b4a"/></linearGradient>
<linearGradient id="forest" x2="0" y2="1"><stop stop-color="#3a6862"/><stop offset="1" stop-color="#143b3b"/></linearGradient>
<linearGradient id="grass" x2="0" y2="1"><stop stop-color="#54725f"/><stop offset="1" stop-color="#193e39"/></linearGradient>
<linearGradient id="wall" x2=".1" y2="1"><stop stop-color="#f3dfc1"/><stop offset=".45" stop-color="#d6c3aa"/><stop offset="1" stop-color="#b5ae9b"/></linearGradient>
<linearGradient id="roof" x2=".2" y2="1"><stop stop-color="#5d7775"/><stop offset=".6" stop-color="#344f53"/><stop offset="1" stop-color="#1c373e"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#2f5a60"/><stop offset=".42" stop-color="#688a83"/><stop offset="1" stop-color="#b0a18b"/></linearGradient>
<linearGradient id="warm" x2="0" y2="1"><stop stop-color="#ffe9b5"/><stop offset=".7" stop-color="#e8b878"/><stop offset="1" stop-color="#9f735f"/></linearGradient>
<linearGradient id="path" x2="0" y2="1"><stop stop-color="#e6cda8"/><stop offset="1" stop-color="#ad9a88"/></linearGradient>
<radialGradient id="lamp"><stop stop-color="#fff2b9" stop-opacity=".95"/><stop offset=".25" stop-color="#ffdda0" stop-opacity=".7"/><stop offset="1" stop-color="#f9cc81" stop-opacity="0"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="paper" width="23" height="27" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".7" fill="#fff0d6" opacity=".22"/><circle cx="15" cy="19" r=".8" fill="#18372c" opacity=".15"/></pattern>
<style><![CDATA[
#cloud-a{animation:drift 48s ease-in-out infinite alternate}#cloud-b{animation:drift 56s ease-in-out infinite alternate-reverse}
#tree-left{animation:sway 10s ease-in-out infinite alternate;transform-origin:210px 800px}
#tree-right{animation:sway2 13s ease-in-out infinite alternate;transform-origin:1360px 790px}
#lanterns{animation:shine 5.7s ease-in-out infinite alternate}
#fireflies circle{animation:twinkle 3.7s ease-in-out infinite alternate}
#fireflies circle:nth-child(2n){animation-delay:.8s}#fireflies circle:nth-child(3n){animation-delay:1.8s}
@keyframes drift{to{transform:translateX(48px)}}@keyframes sway{to{transform:rotate(1.5deg)}}@keyframes sway2{to{transform:rotate(-1.8deg)}}@keyframes shine{to{opacity:.72}}@keyframes twinkle{to{opacity:.16;transform:translate(5px,-6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
<path d="M0 1000V0H1600V1000Z" fill="url(#paper)" opacity=".25"/>
<g id="cloud-a" opacity=".3" fill="#fff3e5"><ellipse cx="380" cy="180" rx="184" ry="34"/><ellipse cx="316" cy="169" rx="85" ry="42"/><ellipse cx="489" cy="166" rx="95" ry="47"/><ellipse cx="650" cy="275" rx="160" ry="27"/></g>
<g id="cloud-b" opacity=".23" fill="#e9d9dc"><ellipse cx="1120" cy="113" rx="225" ry="35"/><ellipse cx="1068" cy="101" rx="84" ry="47"/><ellipse cx="1260" cy="94" rx="91" ry="38"/><ellipse cx="1355" cy="225" rx="138" ry="21"/></g>
