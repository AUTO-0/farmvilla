<style><![CDATA[
.leaf-a{transform-origin:225px 350px;animation:sway-a 8s ease-in-out infinite alternate}
.leaf-b{transform-origin:1030px 320px;animation:sway-b 9s ease-in-out infinite alternate}
.glow{animation:breathe 6s ease-in-out infinite alternate}
.pollen{animation:drift 9s linear infinite}
@keyframes sway-a{to{transform:rotate(2.3deg)}}@keyframes sway-b{to{transform:rotate(-2.5deg)}}
@keyframes breathe{to{opacity:.66;transform:scale(1.04);transform-origin:855px 215px}}
@keyframes drift{to{transform:translate(14px,-12px);opacity:.3}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>
